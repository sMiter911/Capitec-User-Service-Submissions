apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-deployment
  labels:
    name: spring-boot-user-service
    app: capitec-user-service
spec:
  replicas: 4
  selector:
    matchLabels:
      name: spring-boot-user-service
      app: capitec-user-service
  template:
    metadata:
      labels:
        name: spring-boot-user-service
        app: capitec-user-service
    spec:
      containers:
        - name: spring-boot-user-service
          image: thapeloseema/capitec-user-service:backend-amd64
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/capitec_user_service
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-deployment-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-deployment-secret
                  key: POSTGRES_PASSWORD
        