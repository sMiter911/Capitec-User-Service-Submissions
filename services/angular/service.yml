apiVersion: v1
kind: Service
metadata:
  name: angular-service
  labels:
    name: angular-user-service
    app: capitec-user-service
spec:
  selector:
    name: angular-user-service
    app: capitec-user-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4200
      nodePort: 30000
  type: NodePort